<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Badminton Score</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
            user-select: none;
            touch-action: manipulation;
        }

        #settings-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            padding: 10px;
            box-sizing: border-box;
        }
        h1 { font-size: 20px; margin-bottom: 10px; text-align: center; }
        p.subtitle { font-size: 14px; color: #aaa; margin: 0 0 20px 0; text-align: center; }
        .radio-group { margin-bottom: 20px; font-size: 18px; display: flex; flex-direction: column; gap: 15px; }
        .radio-group label { display: flex; align-items: center; background: #222; padding: 10px 20px; border-radius: 10px; }
        .radio-group input { margin-right: 10px; transform: scale(1.5); }
        .start-btn { background-color: #34C759; color: white; border: none; padding: 15px 40px; font-size: 18px; font-weight: bold; border-radius: 20px; }

        #score-screen { display: none; flex-direction: column; height: 100%; width: 100%; position: relative; }
        
        .player-area { flex: 1; display: flex; justify-content: center; align-items: center; font-size: 80px; font-weight: bold; transition: background-color 0.1s; position: relative;}
        .player-area-gameover { position: absolute; font-size: 24px; color: white; background-color: rgba(0,0,0,0.6); padding: 5px 10px; border-radius: 5px;}
        #area-a { background-color: #3a0000; color: #ff4d4d; }
        #area-b { background-color: #001a3a; color: #4da6ff; }
        #area-a:active:not(.disabled) { background-color: #ff4d4d; color: #fff; }
        #area-b:active:not(.disabled) { background-color: #4da6ff; color: #fff; }
        .player-area.disabled { opacity: 0.5; pointer-events: none; }

        .controls { height: 45px; display: flex; background-color: #333; }
        .ctrl-btn { flex: 1; background: transparent; border: none; color: white; font-size: 16px; font-weight: bold; }
        .ctrl-btn:first-child { border-right: 1px solid #555; color: #FFD60A; }

        /* カスタム確認モーダル（ポップアップの代わり） */
        #confirm-modal {
            display: none; /* 初期は非表示 */
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.9);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        #confirm-modal p { font-size: 18px; margin-bottom: 20px; font-weight: bold; }
        .modal-btn-group { display: flex; gap: 15px; }
        .modal-btn { padding: 12px 20px; font-size: 16px; font-weight: bold; border: none; border-radius: 10px; }
        .btn-cancel { background-color: #555; color: white; }
        .btn-end { background-color: #ff3b30; color: white; }
    </style>
</head>
<body>

    <div id="settings-screen">
        <h1>バドミントン<br>スコアボード</h1>
        <p class="subtitle">【終了ボタン修正版】</p>
        <div class="radio-group">
            <label><input type="radio" name="points" value="15"> 15点マッチ</label>
            <label><input type="radio" name="points" value="21" checked> 21点マッチ</label>
        </div>
        <button class="start-btn" onclick="startMatch()">スタート</button>
    </div>

    <div id="score-screen">
        <div id="area-a" class="player-area" onclick="addScore('A')">0</div>
        <div class="controls">
            <button class="ctrl-btn" onclick="undoScore()">戻す</button>
            <button class="ctrl-btn" onclick="endMatch()">終了</button>
        </div>
        <div id="area-b" class="player-area" onclick="addScore('B')">0</div>

        <!-- カスタム確認画面 -->
        <div id="confirm-modal">
            <p>試合を終了しますか？</p>
            <div class="modal-btn-group">
                <button class="modal-btn btn-cancel" onclick="confirmEndMatch(false)">キャンセル</button>
                <button class="modal-btn btn-end" onclick="confirmEndMatch(true)">終了する</button>
            </div>
        </div>
    </div>

    <script>
        let scoreA = 0;
        let scoreB = 0;
        let targetPoint = 21;
        let history = []; 
        let currentServer = null;
        let endgameTimeoutId = null; 

        const screenSettings = document.getElementById('settings-screen');
        const screenScore = document.getElementById('score-screen');
        const displayA = document.getElementById('area-a');
        const displayB = document.getElementById('area-b');
        const playerAreas = document.querySelectorAll('.player-area');
        const confirmModal = document.getElementById('confirm-modal');

        function startMatch() {
            const radios = document.getElementsByName('points');
            for (let i = 0; i < radios.length; i++) {
                if (radios[i].checked) { targetPoint = parseInt(radios[i].value); break; }
            }
            scoreA = 0; scoreB = 0; history = []; currentServer = null;
            if (endgameTimeoutId) {
                clearTimeout(endgameTimeoutId);
                endgameTimeoutId = null;
            }
            
            updateDisplay();
            playerAreas.forEach(area => area.classList.remove('disabled'));
            const oldOverlays = document.querySelectorAll('.player-area-gameover');
            oldOverlays.forEach(overlay => overlay.remove());

            confirmModal.style.display = 'none'; // 確認画面を隠す
            screenSettings.style.display = 'none';
            screenScore.style.display = 'flex';

            if ('speechSynthesis' in window) {
                let initUtterance = new SpeechSynthesisUtterance('');
                window.speechSynthesis.speak(initUtterance);
            }
        }

        function isGameOver() {
            const diff = Math.abs(scoreA - scoreB);
            const cappedScore = targetPoint === 21 ? 30 : 21;
            
            if (scoreA === cappedScore || scoreB === cappedScore) return true;
            if ((scoreA >= targetPoint || scoreB >= targetPoint) && diff >= 2) return true;
            return false;
        }

        function addScore(player) {
            if (isGameOver()) return;
            
            history.push({ a: scoreA, b: scoreB, server: currentServer });

            if (player === 'A') scoreA++;
            if (player === 'B') scoreB++;
            
            currentServer = player;
            updateDisplay();
            speakScore();
            checkWinner();
        }

        function undoScore() {
            if (history.length > 0) {
                if (endgameTimeoutId) {
                    clearTimeout(endgameTimeoutId);
                    endgameTimeoutId = null;
                }
                
                const previousState = history.pop();
                scoreA = previousState.a;
                scoreB = previousState.b;
                currentServer = previousState.server;
                
                updateDisplay();
                playerAreas.forEach(area => area.classList.remove('disabled'));
                const oldOverlays = document.querySelectorAll('.player-area-gameover');
                oldOverlays.forEach(overlay => overlay.remove());

                if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            }
        }

        // --- 終了ボタンの処理を修正 ---
        function endMatch() {
            // Apple Watchで動かない標準ポップアップの代わりに、自作の確認画面を表示する
            confirmModal.style.display = 'flex';
        }

        // 自作の確認画面のボタンが押された時の処理
        function confirmEndMatch(isConfirmed) {
            confirmModal.style.display = 'none'; // 確認画面を閉じる
            if (isConfirmed) {
                resetToSettingsScreen();
            }
        }
        // ------------------------------

        function checkWinner() {
            if (isGameOver()) {
                playerAreas.forEach(area => area.classList.add('disabled'));
                
                const winnerAreaId = (currentServer === 'A') ? 'area-a' : 'area-b';
                const winnerArea = document.getElementById(winnerAreaId);
                const overlay = document.createElement('div');
                overlay.className = 'player-area-gameover';
                overlay.innerText = 'Game set';
                winnerArea.appendChild(overlay);

                if (endgameTimeoutId) clearTimeout(endgameTimeoutId);
                endgameTimeoutId = setTimeout(() => {
                    resetToSettingsScreen();
                }, 3000);
            }
        }

        function resetToSettingsScreen() {
            screenSettings.style.display = 'flex';
            screenScore.style.display = 'none';
            confirmModal.style.display = 'none';
            scoreA = 0; scoreB = 0; history = []; currentServer = null;
            if (endgameTimeoutId) {
                clearTimeout(endgameTimeoutId);
                endgameTimeoutId = null;
            }
            updateDisplay();
        }

        function updateDisplay() {
            displayA.innerText = scoreA;
            displayB.innerText = scoreB;
        }

        function speakScore() {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();

            let serverScore = (currentServer === 'A') ? scoreA : scoreB;
            let receiverScore = (currentServer === 'A') ? scoreB : scoreA;
            const maxPoint = targetPoint === 21 ? 30 : 21;

            let serverText = serverScore === 0 ? "love" : serverScore;
            let receiverText = receiverScore === 0 ? "love" : receiverScore;
            
            let speakText = "";
            
            if (isGameOver()) {
                speakText = "Game set";
            } else {
                if (serverScore === receiverScore) {
                    speakText = serverText + " all";
                } else {
                    speakText = serverText + ", " + receiverText;
                }
                
                const nextScore = serverScore + 1;
                const cappedScore = targetPoint === 21 ? 30 : 21;
                let isMatchPoint = (nextScore === cappedScore);
                if (!isMatchPoint) {
                    isMatchPoint = (nextScore >= targetPoint && (nextScore - receiverScore) >= 2);
                }
                
                if (isMatchPoint) {
                    speakText += ", Match point";
                }
            }

            const utterance = new SpeechSynthesisUtterance(speakText);
            utterance.lang = 'en-US';
            utterance.rate = 1.0;
            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
