<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Badminton Score</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
            user-select: none;
            touch-action: manipulation;
        }

        #settings-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            padding: 10px;
            box-sizing: border-box;
        }
        h1 { font-size: 20px; margin-bottom: 20px; text-align: center; }
        .radio-group { margin-bottom: 20px; font-size: 18px; display: flex; flex-direction: column; gap: 15px; }
        .radio-group label { display: flex; align-items: center; background: #222; padding: 10px 20px; border-radius: 10px; }
        .radio-group input { margin-right: 10px; transform: scale(1.5); }
        .start-btn { background-color: #34C759; color: white; border: none; padding: 15px 40px; font-size: 18px; font-weight: bold; border-radius: 20px; }

        #score-screen { display: none; flex-direction: column; height: 100%; width: 100%; }
        
        .player-area { flex: 1; display: flex; justify-content: center; align-items: center; font-size: 80px; font-weight: bold; transition: background-color 0.1s; }
        #area-a { background-color: #3a0000; color: #ff4d4d; }
        #area-b { background-color: #001a3a; color: #4da6ff; }
        #area-a:active { background-color: #ff4d4d; color: #fff; }
        #area-b:active { background-color: #4da6ff; color: #fff; }

        .controls { height: 45px; display: flex; background-color: #333; }
        .ctrl-btn { flex: 1; background: transparent; border: none; color: white; font-size: 16px; font-weight: bold; }
        .ctrl-btn:first-child { border-right: 1px solid #555; color: #FFD60A; }
    </style>
</head>
<body>

    <div id="settings-screen">
        <h1>バドミントン<br>スコアボード</h1>
        <div class="radio-group">
            <label><input type="radio" name="points" value="15"> 15点マッチ</label>
            <label><input type="radio" name="points" value="21" checked> 21点マッチ</label>
        </div>
        <button class="start-btn" onclick="startMatch()">スタート</button>
    </div>

    <div id="score-screen">
        <!-- 上半分 -->
        <div id="area-a" class="player-area" onclick="addScore('A')">0</div>
        
        <div class="controls">
            <button class="ctrl-btn" onclick="undoScore()">戻す</button>
            <button class="ctrl-btn" onclick="endMatch()">終了</button>
        </div>
        
        <!-- 下半分 -->
        <div id="area-b" class="player-area" onclick="addScore('B')">0</div>
    </div>

    <script>
        let scoreA = 0;
        let scoreB = 0;
        let targetPoint = 21;
        let history = []; 
        let currentServer = null; // 現在のサーブ権を持っているプレイヤー

        const screenSettings = document.getElementById('settings-screen');
        const screenScore = document.getElementById('score-screen');
        const displayA = document.getElementById('area-a');
        const displayB = document.getElementById('area-b');

        function startMatch() {
            const radios = document.getElementsByName('points');
            for (let i = 0; i < radios.length; i++) {
                if (radios[i].checked) { targetPoint = parseInt(radios[i].value); break; }
            }
            scoreA = 0; scoreB = 0; history = []; currentServer = null;
            updateDisplay();
            screenSettings.style.display = 'none';
            screenScore.style.display = 'flex';

            // 音声合成の初期化（iOS/watchOSの制限回避のため、初回タップ時に無音を再生）
            if ('speechSynthesis' in window) {
                let initUtterance = new SpeechSynthesisUtterance('');
                window.speechSynthesis.speak(initUtterance);
            }
        }

        function addScore(player) {
            // 現在のスコアとサーブ権を保存（Undo用）
            history.push({ a: scoreA, b: scoreB, server: currentServer });

            if (player === 'A') scoreA++;
            if (player === 'B') scoreB++;
            
            // 得点した側を次のサーバーにする
            currentServer = player;

            updateDisplay();
            
            // 音声読み上げを実行
            speakScore();
            
            checkWinner();
        }

        function undoScore() {
            if (history.length > 0) {
                const previousState = history.pop();
                scoreA = previousState.a;
                scoreB = previousState.b;
                currentServer = previousState.server; // サーブ権も元に戻す
                updateDisplay();
                // 戻した直後は音が混ざらないように読み上げをキャンセル
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                }
            }
        }

        function endMatch() {
            if (confirm('試合を終了しますか？')) {
                screenSettings.style.display = 'flex';
                screenScore.style.display = 'none';
            }
        }

        function updateDisplay() {
            displayA.innerText = scoreA;
            displayB.innerText = scoreB;
        }

        // --- スコアを英語で読み上げる関数 ---
        function speakScore() {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel(); // 前の音声をキャンセル

            let serverScore = (currentServer === 'A') ? scoreA : scoreB;
            let receiverScore = (currentServer === 'A') ? scoreB : scoreA;

            // バドミントンの読み方に変換 (0 は Love)
            let serverText = serverScore === 0 ? "love" : serverScore;
            let receiverText = receiverScore === 0 ? "love" : receiverScore;
            
            let speakText = "";
            
            if (serverScore === receiverScore) {
                speakText = serverText + " all"; // 同点は「オール」
            } else {
                speakText = serverText + ", " + receiverText; // サーバーの得点 → レシーバーの得点
            }

            const utterance = new SpeechSynthesisUtterance(speakText);
            utterance.lang = 'en-US'; // 英語のネイティブ発音に設定
            utterance.rate = 1.0; // 話す速度
            
            window.speechSynthesis.speak(utterance);
        }

        function checkWinner() {
            const maxPoint = targetPoint === 21 ? 30 : 21; 
            if ((scoreA >= targetPoint || scoreB >= targetPoint) && Math.abs(scoreA - scoreB) >= 2) {
                setTimeout(() => alert('ゲームセット！'), 500);
            } else if (scoreA === maxPoint || scoreB === maxPoint) {
                setTimeout(() => alert('ゲームセット！'), 500);
            }
        }
    </script>
</body>
</html>
