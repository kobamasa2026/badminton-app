<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>バドミントン組み合わせ管理</title>
    <style>
        :root {
            --primary: #4F46E5;
            --bg: #111827;
            --surface: #1F2937;
            --text: #F9FAFB;
            --accent: #F59E0B;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 10px;
        }
        h1, h2 { text-align: center; margin-bottom: 10px; }
        h1 { font-size: 2rem; color: var(--accent); margin-top: 5px; margin-bottom: 15px;}
        
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            align-items: center;
            background: var(--surface);
            padding: 15px;
            border-radius: 12px;
        }
        .input-group {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .num-input {
            width: 60px;
            padding: 12px;
            font-size: 1.3rem;
            border: 2px solid #4B5563;
            background: #374151;
            color: white;
            border-radius: 8px;
            text-align: center;
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        button:active { transform: scale(0.98); }
        button.action-btn { background-color: var(--accent); font-size: 1.4rem; padding: 14px 30px;}
        button.danger { background-color: #EF4444; font-size: 1rem; padding: 10px 15px;}
        
        .courts-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .court {
            background: var(--surface);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            text-align: center;
            border: 2px solid #374151;
        }
        .court-header { 
            background: #374151; 
            color: var(--accent); 
            font-size: 1.8rem; 
            font-weight: 900; 
            padding: 10px; 
            border-radius: 8px;
            margin-top: 0;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }
        .match-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        .team { 
            font-size: 2.2rem; 
            font-weight: 900; 
            background: #10B981; 
            color: white;
            padding: 15px 20px;
            border-radius: 12px;
            min-width: 120px;
            display: inline-block;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }
        .team.team-b {
            background: #3B82F6; 
        }
        .vs { 
            color: #9CA3AF; 
            font-size: 1.5rem; 
            font-weight: bold;
            font-style: italic;
        }

        .players-container {
            background: var(--surface);
            padding: 16px;
            border-radius: 12px;
            margin-top: 40px;
        }
        .players-container h2 { color: #9CA3AF; font-size: 1.2rem;}
        
        .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }
        
        .player-chip {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #374151;
            padding: 10px;
            border-radius: 8px;
            border: 2px solid transparent;
        }
        .player-chip.active {
            border-color: #10B981;
        }
        .player-chip.inactive {
            opacity: 0.5;
            background: #1F2937;
            border-color: #4B5563;
        }
        
        .chip-name { font-size: 1.4rem; font-weight: bold; }
        .chip-count { font-size: 0.9rem; color: #9CA3AF; }
        
        .status-toggle {
            margin-top: 5px;
            padding: 4px 10px;
            font-size: 0.8rem;
            border-radius: 4px;
        }
        .active .status-toggle { background: #10B981; }
        .inactive .status-toggle { background: #6B7280; }
        
    </style>
</head>
<body>

    <h1>🏸 組み合わせボード</h1>
    
    <div class="controls">
        <button onclick="generateMatches()" class="action-btn">⚡ 組み合わせを作成</button>
        <div class="input-group">
            <input type="number" id="addNum" class="num-input" value="40" min="1">
            <button onclick="addPlayers()">👥 追加</button>
        </div>
        <button onclick="resetData()" class="danger">🗑️ リセット</button>
    </div>

    <div class="courts-container" id="courtsArea">
        <p style="text-align:center; width:100%; color:#9CA3AF; font-size:1.5rem; padding: 50px 0;">上の「⚡組み合わせを作成」ボタンを押してください</p>
    </div>

    <div class="players-container">
        <!-- ここの activeCount がエラーの原因になりやすいため、構造をシンプルにしました -->
        <h2>👥 参加者管理 （現在参加中: <span id="activeCount">0</span>人）</h2>
        <div class="players-grid" id="playersArea"></div>
    </div>

    <script>
        let players = [];
        const MAX_COURTS = 6;
        const PLAYERS_PER_COURT = 4;

        // 画面が完全に読み込まれてからプログラムを開始する（エラー防止策）
        window.onload = function() {
            try {
                // 保存場所を V3 に変更し、過去のエラーデータを回避
                let savedData = localStorage.getItem('badminPlayersV3');
                if (savedData) {
                    players = JSON.parse(savedData);
                }
            } catch(e) {
                console.log("データの読み込みをスキップしました");
            }
            // 配列でない異常なデータの場合は初期化する
            if (!Array.isArray(players)) {
                players = [];
            }
            renderPlayers();
        };

        function addPlayers() {
            const numInput = document.getElementById('addNum');
            if (!numInput) return;
            const num = parseInt(numInput.value);
            if (!num || isNaN(num) || num <= 0) return;
            
            const currentCount = players.length;
            for (let i = 0; i < num; i++) {
                players.push({
                    id: currentCount + i + 1,
                    name: (currentCount + i + 1),
                    playCount: 0,
                    active: true
                });
            }
            saveAndRender();
        }

        function toggleStatus(id) {
            const player = players.find(p => p.id === id);
            if (player) {
                player.active = !player.active;
                saveAndRender();
            }
        }

        function generateMatches() {
            let activePlayers = players.filter(p => p.active);
            const courtsArea = document.getElementById('courtsArea');
            if (!courtsArea) return;
            
            if (activePlayers.length < PLAYERS_PER_COURT) {
                courtsArea.innerHTML = '<p style="text-align:center; width:100%; color:#EF4444; font-size:1.5rem; font-weight:bold; padding:50px 0;">⚠️ 参加人数が足りません</p>';
                return;
            }

            activePlayers.sort((a, b) => {
                if (a.playCount !== b.playCount) return a.playCount - b.playCount;
                return Math.random() - 0.5;
            });

            let possibleCourts = Math.floor(activePlayers.length / PLAYERS_PER_COURT);
            let courtsToUse = Math.min(possibleCourts, MAX_COURTS);
            let playersNeeded = courtsToUse * PLAYERS_PER_COURT;

            let selectedPlayers = activePlayers.slice(0, playersNeeded);
            selectedPlayers.forEach(p => p.playCount++);
            selectedPlayers.sort(() => Math.random() - 0.5);

            saveAndRender();

            courtsArea.innerHTML = "";
            for (let i = 0; i < courtsToUse; i++) {
                let p1 = selectedPlayers[i * 4];
                let p2 = selectedPlayers[i * 4 + 1];
                let p3 = selectedPlayers[i * 4 + 2];
                let p4 = selectedPlayers[i * 4 + 3];

                courtsArea.innerHTML += `
                    <div class="court">
                        <div class="court-header">コート ${i + 1}</div>
                        <div class="match-row">
                            <div class="team">${p1.name} & ${p2.name}</div>
                            <div class="vs">VS</div>
                            <div class="team team-b">${p3.name} & ${p4.name}</div>
                        </div>
                    </div>
                `;
            }
        }

        function resetData() {
            players = [];
            const courtsArea = document.getElementById('courtsArea');
            if (courtsArea) {
                courtsArea.innerHTML = '<p style="text-align:center; width:100%; color:#9CA3AF; font-size:1.5rem; padding: 50px 0;">上の「⚡組み合わせを作成」ボタンを押してください</p>';
            }
            saveAndRender();
        }

        function saveAndRender() {
            try {
                localStorage.setItem('badminPlayersV3', JSON.stringify(players));
            } catch(e) {}
            renderPlayers();
        }

        function renderPlayers() {
            const area = document.getElementById('playersArea');
            const countDisplay = document.getElementById('activeCount');
            if (!area || !countDisplay) return; // エラー防止用チェック

            area.innerHTML = "";
            let activeCount = 0;

            players.forEach(p => {
                if (p.active) activeCount++;
                const statusClass = p.active ? "active" : "inactive";
                const statusText = p.active ? "参加" : "休憩";
                
                area.innerHTML += `
                    <div class="player-chip ${statusClass}">
                        <div class="chip-name">${p.name}番</div>
                        <div class="chip-count">${p.playCount}回</div>
                        <button class="status-toggle" onclick="toggleStatus(${p.id})">
                            ${statusText}
                        </button>
                    </div>
                `;
            });
            countDisplay.innerText = activeCount;
        }
    </script>
</body>
</html>
