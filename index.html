<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>バドミントン組み合わせボード V7</title>
    <style>
        :root {
            --primary: #4F46E5;
            --bg: #111827;
            --surface: #1F2937;
            --surface-light: #374151;
            --text: #F9FAFB;
            --absent: #4B5563; /* 未受付 */
            --waiting: #F59E0B; /* 待機 */
            --break: #EF4444;   /* 休憩 */
            --playing: #10B981; /* 試合中 */
            --team-a: #10B981;
            --team-b: #3B82F6;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 10px; }
        h1, h2, h3 { margin: 0 0 10px 0; text-align: center; }
        h1 { font-size: 1.6rem; color: #F59E0B; margin-bottom: 15px;}
        
        .header-controls { display: flex; justify-content: space-between; align-items: center; background: var(--surface); padding: 10px 15px; border-radius: 12px; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;}
        .header-controls button { padding: 8px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; border: none; color: white;}
        
        .app-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
        @media (min-width: 1024px) { .app-grid { grid-template-columns: 280px 320px 1fr; align-items: start; } }

        /* パネル共通 */
        .panel { background: var(--surface); padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .panel-title { font-size: 1.1rem; color: #D1D5DB; border-bottom: 1px solid var(--surface-light); padding-bottom: 8px; margin-bottom: 12px; }

        /* 入力フォーム */
        .input-group { display: flex; gap: 5px; margin-bottom: 15px; }
        .input-group input { flex-grow: 1; background: var(--bg); color: white; border: 1px solid #4B5563; padding: 8px; border-radius: 6px; }
        .input-group button { background: var(--primary); color: white; border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }

        /* プレイヤーチップ */
        .chip-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(85px, 1fr)); gap: 8px; max-height: 50vh; overflow-y: auto; padding-right: 5px; }
        .chip { border-radius: 6px; padding: 8px 4px; text-align: center; cursor: pointer; transition: transform 0.1s; display: flex; flex-direction: column; gap: 4px; border: 2px solid transparent; user-select: none;}
        .chip:active { transform: scale(0.95); }
        .chip-name { font-size: 0.95rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: white;}
        .chip-sub { font-size: 0.7rem; color: rgba(255,255,255,0.7); }
        
        /* 状態カラー */
        .chip.absent { background: var(--absent); border-color: #374151; opacity: 0.7;}
        .chip.waiting { background: rgba(245, 158, 11, 0.15); border-color: var(--waiting); }
        .chip.break { background: rgba(239, 68, 68, 0.15); border-color: var(--break); opacity: 0.7; }
        .chip.playing { background: rgba(16, 185, 129, 0.15); border-color: var(--playing); }
        .chip.next { border-color: #A855F7; box-shadow: 0 0 8px rgba(168, 85, 247, 0.5); } /* NEXT強調 */

        /* メインアクション */
        .main-actions { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap;}
        .action-btn { background: #F59E0B; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; flex-grow: 1; }
        .action-btn.secondary { background: #6366F1; }
        .action-btn:active { transform: scale(0.98); }

        /* NEXTリスト */
        .next-queue { background: #2E1065; border: 1px solid #A855F7; padding: 10px; border-radius: 8px; margin-bottom: 15px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;}
        .next-item { background: rgba(168,85,247,0.3); padding: 5px 15px; border-radius: 4px; font-weight: bold; color: white; }

        /* コート */
        .courts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
        .court { background: var(--surface-light); border-radius: 10px; padding: 12px; text-align: center; border: 2px solid transparent; }
        .court-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; color: #D1D5DB; font-weight: bold;}
        
        .match-row { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 12px; }
        .team { font-size: 1.1rem; font-weight: bold; background: var(--team-a); color: white; padding: 10px; border-radius: 8px; flex-grow: 1; }
        .team.b { background: var(--team-b); }
        
        .court-btn { width: 100%; padding: 10px; border-radius: 6px; font-weight: bold; border: none; cursor: pointer; color: white; }
        .btn-end { background: #EF4444; }
        .btn-fill { background: #10B981; }
        
        /* モーダル (ポップアップ) */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 100; justify-content: center; align-items: center; }
        .modal-content { background: var(--surface); padding: 20px; border-radius: 12px; width: 90%; max-width: 300px; text-align: center; }
        .modal-btn { display: block; width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: none; font-size: 1.1rem; font-weight: bold; cursor: pointer; color: white; }
    </style>
</head>
<body>

    <div class="header-controls">
        <h1 style="margin:0;">🏸 組み合わせボード V7</h1>
        <div style="display:flex; gap:10px; align-items:center;">
            <span style="font-size:0.9rem; color:#9CA3AF;">コート上限:</span>
            <button style="background:#4B5563;" onclick="changeMaxCourts(-1)">-</button>
            <span id="courtCountTxt" style="font-weight:bold; font-size:1.1rem;">6</span>
            <button style="background:#4B5563;" onclick="changeMaxCourts(1)">+</button>
            
            <button style="background:#EF4444; margin-left:15px;" onclick="startNewDay()">🌅 新しい日を始める(本日リセット)</button>
        </div>
    </div>

    <div class="app-grid">
        
        <!-- 左パネル：会員名簿（マスター） -->
        <div class="panel">
            <h2 class="panel-title">👥 会員名簿 (未受付)</h2>
            <div class="input-group">
                <input type="text" id="newMemberName" maxlength="6" placeholder="新規メンバー登録">
                <button onclick="addMember()">登録</button>
            </div>
            <p style="font-size:0.8rem; color:#9CA3AF; margin-bottom:10px;">タップして本日の受付を完了</p>
            <div class="chip-container" id="absentList">
                <!-- 未受付メンバー -->
            </div>
        </div>

        <!-- 中パネル：本日の参加者 -->
        <div class="panel">
            <h2 class="panel-title">✅ 本日の参加者 (<span id="activeCount" style="color:var(--waiting);">0</span>名)</h2>
            <p style="font-size:0.8rem; color:#9CA3AF; margin-bottom:10px;">
                <span style="color:var(--waiting);">■待機</span> 
                <span style="color:#A855F7;">■NEXT</span> 
                <span style="color:var(--playing);">■試合中</span> 
                <span style="color:var(--break);">■休憩</span><br>
                ※タップして休憩・早退に切り替え
            </p>
            <div class="chip-container" id="presentList">
                <!-- 受付済みメンバー -->
            </div>
        </div>

        <!-- 右パネル：コート管理 -->
        <div class="panel" style="background:transparent; padding:0; box-shadow:none;">
            
            <div class="main-actions">
                <button class="action-btn" onclick="fillAllEmptyCourts()">⚡ 空きコートを一斉補充</button>
                <button class="action-btn secondary" onclick="reshuffleSelectedCourts()">🔁 選択コートを再抽選</button>
            </div>

            <div class="next-queue">
                <span style="color:#DDD6FE; font-size:0.9rem; line-height:30px;">⏩ NEXT(順番):</span>
                <div id="nextNames" style="display:flex; gap:8px;"></div>
            </div>

            <div class="courts-grid" id="courtsArea">
                <!-- コート -->
            </div>
        </div>

    </div>

    <!-- 状態変更モーダル -->
    <div class="modal-overlay" id="statusModal">
        <div class="modal-content">
            <h2 id="modalPlayerName" style="color:white; margin-bottom:20px;">名前</h2>
            <div id="modalButtons"></div>
            <button class="modal-btn" style="background:#4B5563; margin-top:20px;" onclick="closeModal()">キャンセル</button>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. データ構造 (完全に再構築)
        // ==========================================
        let db = {
            players: [], // { id, name, status: 'absent'|'waiting'|'break'|'playing', playCount }
            queue: [],   // [id, id, ...] 厳密な順番待ち配列
            courts: [],  // { id, p: [id, id, id, id], selected: false }
            maxCourts: 6
        };

        const STORAGE_KEY = 'badmin_v7_data';

        window.onload = function() {
            let saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    let parsed = JSON.parse(saved);
                    if (parsed.players) db.players = parsed.players;
                    if (parsed.queue) db.queue = parsed.queue;
                    if (parsed.courts) db.courts = parsed.courts;
                    if (parsed.maxCourts) db.maxCourts = parsed.maxCourts;
                } catch(e) {}
            }
            adjustCourts();
            render();
        };

        function save() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
        }

        // ==========================================
        // 2. システム操作
        // ==========================================
        function changeMaxCourts(delta) {
            let n = db.maxCourts + delta;
            if (n >= 1 && n <= 12) {
                db.maxCourts = n;
                adjustCourts();
                render();
            }
        }

        function adjustCourts() {
            while (db.courts.length < db.maxCourts) {
                db.courts.push({ id: db.courts.length + 1, p: [], selected: false });
            }
            while (db.courts.length > db.maxCourts) {
                let removed = db.courts.pop();
                // 減らされたコートにいた人を待機列の先頭に戻す(救済措置)
                removed.p.reverse().forEach(id => {
                    let player = db.players.find(p => p.id === id);
                    if (player) {
                        player.status = 'waiting';
                        db.queue.unshift(id); // 先頭へ
                    }
                });
            }
        }

        function startNewDay() {
            if (confirm("名簿(メンバー)は残したまま、本日の受付状態・コート・プレイ回数をすべてリセットしますか？\n※練習の開始時に押してください。")) {
                db.players.forEach(p => {
                    p.status = 'absent';
                    p.playCount = 0;
                });
                db.queue = [];
                db.courts.forEach(c => { c.p = []; c.selected = false; });
                render();
            }
        }

        // ==========================================
        // 3. プレイヤー操作 (堅牢な状態遷移)
        // ==========================================
        function addMember() {
            let input = document.getElementById('newMemberName');
            let name = input.value.trim();
            if (!name) return;
            if (db.players.some(p => p.name === name)) {
                alert("既に登録されています。");
                return;
            }
            db.players.push({
                id: Date.now(),
                name: name,
                status: 'absent',
                playCount: 0
            });
            input.value = "";
            render();
        }

        // 名簿から受付（チェックイン）
        function checkIn(id) {
            let player = db.players.find(p => p.id === id);
            if (!player) return;
            
            player.status = 'waiting';
            db.queue.push(id); // 列の最後尾に並ぶ
            render();
        }

        // 参加者チップをクリックした時のモーダル制御
        let currentModalPlayerId = null;
        function openPlayerMenu(id) {
            let player = db.players.find(p => p.id === id);
            if (!player) return;

            if (player.status === 'playing') {
                alert("現在試合中です。\n休憩や早退にする場合は、先にコートの試合を終了してください。");
                return; // バグ防止: 試合中のステータス変更を物理的にブロック
            }

            currentModalPlayerId = id;
            document.getElementById('modalPlayerName').innerText = player.name + " さん";
            let btnHtml = "";

            if (player.status === 'waiting') {
                btnHtml += `<button class="modal-btn" style="background:var(--break);" onclick="execStatusChange('break')">☕ 休憩する</button>`;
                btnHtml += `<button class="modal-btn" style="background:var(--absent);" onclick="execStatusChange('absent')">🏠 帰宅・受付取消</button>`;
            } else if (player.status === 'break') {
                btnHtml += `<button class="modal-btn" style="background:var(--waiting);" onclick="execStatusChange('waiting')">🏸 待機列に復帰する</button>`;
                btnHtml += `<button class="modal-btn" style="background:var(--absent);" onclick="execStatusChange('absent')">🏠 帰宅する</button>`;
            }

            document.getElementById('modalButtons').innerHTML = btnHtml;
            document.getElementById('statusModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('statusModal').style.display = 'none';
            currentModalPlayerId = null;
        }

        function execStatusChange(newStatus) {
            let player = db.players.find(p => p.id === currentModalPlayerId);
            if (player) {
                // 現在キューにいる場合は一旦削除 (重複防止)
                db.queue = db.queue.filter(q => q !== player.id);
                
                player.status = newStatus;
                
                // 待機に戻る場合のみキューの最後尾に追加
                if (newStatus === 'waiting') {
                    db.queue.push(player.id);
                }
            }
            closeModal();
            render();
        }

        // ==========================================
        // 4. コート操作・マッチメイク
        // ==========================================
        
        // 1つのコートを終了する
        function endCourt(idx) {
            let court = db.courts[idx];
            court.p.forEach(id => {
                let player = db.players.find(p => p.id === id);
                if (player) {
                    player.status = 'waiting';
                    db.queue.push(id); // 終わった順に最後尾へ
                }
            });
            court.p = [];
            court.selected = false;
            render();
        }

        // 1つの空きコートに4人入れる
        function fillCourt(idx) {
            let court = db.courts[idx];
            if (db.queue.length < 4) {
                alert("待機中の人数が4名未満のため補充できません。");
                return;
            }
            
            // キューの先頭から4人を取り出す (splice)
            let selected = db.queue.splice(0, 4);
            selected.forEach(id => {
                let player = db.players.find(p => p.id === id);
                player.status = 'playing';
                player.playCount++;
                court.p.push(id);
            });
            
            // チーム分けシャッフル
            court.p.sort(() => Math.random() - 0.5);
            render();
        }

        // 【一斉補充】 すべての空きコートを埋める
        function fillAllEmptyCourts() {
            let emptyCourts = db.courts.filter(c => c.p.length === 0);
            if (emptyCourts.length === 0) return alert("空きコートがありません。");
            
            let courtsToFill = Math.min(emptyCourts.length, Math.floor(db.queue.length / 4));
            if (courtsToFill === 0) return alert("待機人数が足りません（4名単位で補充します）。");

            // 必要な人数をキューから取り出す
            let playersToAssign = db.queue.splice(0, courtsToFill * 4);
            
            // 全体をシャッフルして多様性を生む
            playersToAssign.sort(() => Math.random() - 0.5);

            for (let i = 0; i < courtsToFill; i++) {
                let court = emptyCourts[i];
                let group = playersToAssign.slice(i * 4, i * 4 + 4);
                group.forEach(id => {
                    let player = db.players.find(p => p.id === id);
                    player.status = 'playing';
                    player.playCount++;
                    court.p.push(id);
                });
            }
            render();
        }

        // 【再抽選】 選択したコートのメンバーを混ぜ直す
        function toggleCheck(idx, checked) {
            db.courts[idx].selected = checked;
            save();
        }

        function reshuffleSelectedCourts() {
            let selected = db.courts.filter(c => c.selected && c.p.length === 4);
            if (selected.length === 0) return alert("再抽選したいコートの「再抽選」にチェックを入れてください。");

            let targetPlayers = [];
            selected.forEach(c => {
                targetPlayers.push(...c.p);
                c.p = [];
                c.selected = false;
            });

            // メンバーをシャッフルして再配置
            targetPlayers.sort(() => Math.random() - 0.5);

            selected.forEach((c, index) => {
                c.p = targetPlayers.slice(index * 4, index * 4 + 4);
            });
            render();
        }

        // ==========================================
        // 5. 画面の描画
        // ==========================================
        function render() {
            save(); // 描画前に必ず保存
            document.getElementById('courtCountTxt').innerText = db.maxCourts;

            let absentHtml = "";
            let presentHtml = "";
            let presentCount = 0;

            // 名簿リストは名前順かID順 (ここでは登録順)
            db.players.forEach(p => {
                let html = "";
                if (p.status === 'absent') {
                    // 未受付 (クリックでチェックイン)
                    html = `<div class="chip absent" onclick="checkIn(${p.id})">
                                <span class="chip-name">${p.name}</span>
                                <span class="chip-sub">登録済</span>
                            </div>`;
                    absentHtml += html;
                } else {
                    // 参加中 (クリックでモーダル)
                    let cls = p.status;
                    let txt = p.status === 'waiting' ? '待機' : p.status === 'break' ? '休憩' : '試合中';
                    
                    // NEXT対象者(キューの先頭4名)のハイライト
                    if (p.status === 'waiting' && db.queue.indexOf(p.id) < 4 && db.queue.indexOf(p.id) !== -1) {
                        cls += " next";
                        txt = "NEXT";
                    }

                    html = `<div class="chip ${cls}" onclick="openPlayerMenu(${p.id})">
                                <span class="chip-name">${p.name}</span>
                                <span class="chip-sub">${txt} (${p.playCount}回)</span>
                            </div>`;
                    presentHtml += html;
                    presentCount++;
                }
            });

            document.getElementById('absentList').innerHTML = absentHtml;
            document.getElementById('presentList').innerHTML = presentHtml;
            document.getElementById('activeCount').innerText = presentCount;

            // NEXTリストの描画
            let nextHtml = "";
            for (let i = 0; i < 4; i++) {
                if (i < db.queue.length) {
                    let p = db.players.find(pl => pl.id === db.queue[i]);
                    nextHtml += `<div class="next-item">${p.name}</div>`;
                } else {
                    nextHtml += `<div class="next-item" style="background:transparent; border:1px dashed #6B7280; color:#9CA3AF;">不足</div>`;
                }
            }
            document.getElementById('nextNames').innerHTML = nextHtml;

            // コートの描画
            let courtsHtml = "";
            db.courts.forEach((c, idx) => {
                let inner = "";
                if (c.p.length === 4) {
                    let p1 = db.players.find(pl => pl.id === c.p[0])?.name;
                    let p2 = db.players.find(pl => pl.id === c.p[1])?.name;
                    let p3 = db.players.find(pl => pl.id === c.p[2])?.name;
                    let p4 = db.players.find(pl => pl.id === c.p[3])?.name;
                    let checked = c.selected ? "checked" : "";

                    inner = `
                        <div class="court-header">
                            <span>コート ${c.id}</span>
                            <label style="cursor:pointer; font-weight:normal; display:flex; align-items:center; gap:5px;">
                                <input type="checkbox" style="transform:scale(1.2);" onchange="toggleCheck(${idx}, this.checked)" ${checked}>再抽選
                            </label>
                        </div>
                        <div class="match-row">
                            <div class="team">${p1}<br>${p2}</div>
                            <span style="color:#9CA3AF; font-weight:bold;">VS</span>
                            <div class="team b">${p3}<br>${p4}</div>
                        </div>
                        <button class="court-btn btn-end" onclick="endCourt(${idx})">⏹️ 試合終了 (空ける)</button>
                    `;
                } else {
                    inner = `
                        <div class="court-header"><span>コート ${c.id}</span></div>
                        <div style="padding:25px 0; color:#6B7280; font-weight:bold;">待機中 (空き)</div>
                        <button class="court-btn btn-fill" onclick="fillCourt(${idx})">▶️ 次の4人を入れる</button>
                    `;
                }
                courtsHtml += `<div class="court" style="border-color:${c.p.length === 4 ? '#374151' : '#4B5563'};">${inner}</div>`;
            });
            document.getElementById('courtsArea').innerHTML = courtsHtml;
        }
    </script>
</body>
</html>
