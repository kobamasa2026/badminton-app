<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>バドミントン組み合わせボード V4</title>
    <style>
        :root {
            --primary: #4F46E5;
            --bg: #111827;
            --surface: #1F2937;
            --surface-light: #374151;
            --text: #F9FAFB;
            --accent: #F59E0B;
            --success: #10B981;
            --danger: #EF4444;
            --team-a: #10B981;
            --team-b: #3B82F6;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 10px;
        }
        h1, h2, h3 { margin: 0 0 10px 0; text-align: center; }
        h1 { font-size: 1.8rem; color: var(--accent); margin-bottom: 20px;}
        
        .app-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        @media (min-width: 1024px) {
            .app-container { flex-direction: row; align-items: flex-start; }
            .sidebar { width: 320px; flex-shrink: 0; position: sticky; top: 10px; }
            .main-board { flex-grow: 1; }
        }

        /* サイドバー (設定・受付) */
        .sidebar {
            background: var(--surface);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .settings-group {
            background: var(--surface-light);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .settings-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1rem;
        }
        select {
            background: var(--bg);
            color: white;
            border: 1px solid #4B5563;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 1rem;
        }
        .btn-small { background: var(--primary); color: white; border: none; padding: 5px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1.2rem;}
        .btn-small:active { transform: scale(0.95); }

        .add-player { display: flex; gap: 5px; margin-bottom: 10px; }
        .add-player input { flex-grow: 1; padding: 8px; border-radius: 6px; border: 1px solid #4B5563; background: var(--bg); color: white; }
        .add-player button { background: var(--primary); color: white; border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }

        .roster-grid, .active-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 8px;
            max-height: 250px;
            overflow-y: auto;
            padding-right: 5px;
        }
        .player-chip {
            background: var(--surface-light);
            border: 2px solid transparent;
            border-radius: 6px;
            padding: 8px 4px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .player-chip:active { transform: scale(0.95); }
        .chip-name { font-size: 0.9rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chip-stats { font-size: 0.75rem; color: #9CA3AF; }
        
        /* 状態によるチップの色分け */
        .player-chip.inactive { opacity: 0.6; }
        .player-chip.waiting { border-color: var(--accent); background: rgba(245, 158, 11, 0.1); }
        .player-chip.playing { border-color: var(--success); background: rgba(16, 185, 129, 0.1); }
        .player-chip.next { border-color: #A855F7; background: rgba(168, 85, 247, 0.1); }

        /* メインボード */
        .main-board {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .action-bar {
            display: flex;
            justify-content: center;
            background: var(--surface);
            padding: 15px;
            border-radius: 12px;
        }
        .action-btn { background: var(--accent); color: white; border: none; padding: 15px 30px; border-radius: 8px; font-size: 1.3rem; font-weight: bold; cursor: pointer; width: 100%; max-width: 400px;}
        .action-btn:active { transform: scale(0.98); }

        /* NEXTパネル */
        .next-panel {
            background: #2E1065;
            border: 2px solid #8B5CF6;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
        }
        .next-panel h3 { color: #DDD6FE; font-size: 1.2rem; margin-bottom: 15px;}
        .next-slots {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .next-slot {
            background: rgba(139, 92, 246, 0.3);
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px dashed #A855F7;
            min-width: 80px;
        }

        /* コート表示 */
        .courts-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
        }
        .court {
            background: var(--surface);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            border: 2px solid var(--surface-light);
            position: relative;
        }
        .court.clickable { cursor: pointer; transition: transform 0.1s, box-shadow 0.2s; }
        .court.clickable:active { transform: scale(0.98); }
        .court.clickable:hover { border-color: #6B7280; }
        
        /* 更新されたコートの強調 */
        .court.updated {
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.4);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 15px rgba(245, 158, 11, 0.4); }
            50% { box-shadow: 0 0 25px rgba(245, 158, 11, 0.8); }
            100% { box-shadow: 0 0 15px rgba(245, 158, 11, 0.4); }
        }

        .court-header { 
            background: var(--surface-light); 
            color: #D1D5DB; 
            font-size: 1.2rem; 
            font-weight: bold; 
            padding: 6px; 
            border-radius: 6px;
            margin-bottom: 10px;
        }
        .match-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 10px; }
        .team { 
            font-size: 1.2rem; 
            font-weight: bold; 
            background: var(--team-a); 
            color: white;
            padding: 10px;
            border-radius: 8px;
            flex-grow: 1;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }
        .team.team-b { background: var(--team-b); }
        .vs { color: #9CA3AF; font-size: 1rem; font-weight: bold; }
        
        .court-action-text {
            color: #9CA3AF;
            font-size: 0.9rem;
            margin-top: 10px;
        }
        
        .empty-text { padding: 30px 0; color: #6B7280; font-size: 1.1rem; }
    </style>
</head>
<body>

    <h1>🏸 組み合わせボード V4</h1>
    
    <div class="app-container">
        
        <!-- 左側：設定・受付パネル -->
        <aside class="sidebar">
            <div class="settings-group">
                <h3>⚙️ 設定</h3>
                <div class="settings-row">
                    <span>進行モード</span>
                    <select id="modeSelect" onchange="changeMode()">
                        <option value="continuous">順次入替 (NEXT連動)</option>
                        <option value="all">一斉入替 (従来型)</option>
                    </select>
                </div>
                <div class="settings-row">
                    <span>使用コート数上限</span>
                    <div>
                        <button class="btn-small" onclick="changeMaxCourts(-1)">-</button>
                        <span id="courtCountDisplay" style="margin: 0 10px; font-size: 1.2rem; font-weight: bold;">6</span>
                        <button class="btn-small" onclick="changeMaxCourts(1)">+</button>
                    </div>
                </div>
                <button onclick="resetData()" style="background:#EF4444; color:white; border:none; padding:8px; border-radius:6px; margin-top:10px; cursor:pointer;">⚠️ 全データリセット</button>
            </div>

            <div class="settings-group">
                <h3>📝 受付・名簿登録</h3>
                <div class="add-player">
                    <input type="text" id="newName" maxlength="6" placeholder="ニックネーム(6文字内)">
                    <button onclick="registerRoster()">登録</button>
                </div>
                <p style="font-size:0.8rem; color:#9CA3AF; margin:0 0 5px 0;">タップで「参加中」へ移動します</p>
                <div class="roster-grid" id="inactiveList">
                    <!-- 名簿データ -->
                </div>
            </div>
        </aside>

        <!-- 右側：メインボード -->
        <main class="main-board">
            
            <div style="background:var(--surface); padding:15px; border-radius:12px;">
                <h3>👥 参加中メンバー (<span id="activeCount" style="color:var(--accent);">0</span>名)</h3>
                <p style="font-size:0.8rem; color:#9CA3AF; margin:0 0 10px 0;">タップで「名簿(休憩・帰宅)」へ戻します / 枠色：黄=待機, 橙=NEXT, 緑=試合中</p>
                <div class="active-grid" id="activeList">
                    <!-- 参加中データ -->
                </div>
            </div>

            <!-- 一斉入れ替えモード用ボタン -->
            <div class="action-bar" id="modeAllControls" style="display: none;">
                <button onclick="generateMatchesAll()" class="action-btn">⚡ 組み合わせを作成 (一斉)</button>
            </div>

            <!-- 順次入れ替えモード用NEXTパネル -->
            <div class="next-panel" id="nextPanel">
                <h3>⏩ NEXT 待機枠 (次の空きコートに入ります)</h3>
                <div class="next-slots" id="nextSlots">
                    <div class="next-slot">不足</div>
                    <div class="next-slot">不足</div>
                    <div class="next-slot">不足</div>
                    <div class="next-slot">不足</div>
                </div>
            </div>

            <div class="courts-container" id="courtsArea">
                <!-- コートデータ -->
            </div>

        </main>
    </div>

    <script>
        // -------------------------
        // 1. データ構造と初期化
        // -------------------------
        const MAX_POSSIBLE_COURTS = 12;
        let globalData = {
            mode: 'continuous',
            maxCourts: 6,
            players: [], 
            // player = { id, name, playCount, status: 'inactive'|'waiting'|'playing', lastAssigned: timestamp, waitedRounds: 0 }
            courts: [], // { id, p: [id1, id2, id3, id4], updated: boolean }
            nextQueue: [] // [id, id, id, id]
        };

        window.onload = function() {
            try {
                let saved = localStorage.getItem('badminPlayersV4');
                if (saved) {
                    let parsed = JSON.parse(saved);
                    globalData.mode = parsed.mode || 'continuous';
                    globalData.maxCourts = parsed.maxCourts || 6;
                    globalData.players = parsed.players || [];
                    globalData.courts = parsed.courts || [];
                    globalData.nextQueue = parsed.nextQueue || [];
                }
            } catch(e) { console.log("初期ロードスキップ"); }
            
            document.getElementById('modeSelect').value = globalData.mode;
            adjustCourtsArray();
            saveAndRender();
        };

        // -------------------------
        // 2. 設定関連ロジック
        // -------------------------
        function changeMode() {
            globalData.mode = document.getElementById('modeSelect').value;
            // モード切替時は安全のためコートとNEXTを空にして全員待機に戻す
            globalData.players.forEach(p => { if (p.status !== 'inactive') p.status = 'waiting'; });
            globalData.courts.forEach(c => { c.p = []; c.updated = false; });
            globalData.nextQueue = [];
            fillNextQueue();
            saveAndRender();
        }

        function changeMaxCourts(delta) {
            let newMax = globalData.maxCourts + delta;
            if (newMax >= 1 && newMax <= MAX_POSSIBLE_COURTS) {
                globalData.maxCourts = newMax;
                adjustCourtsArray();
                fillNextQueue();
                saveAndRender();
            }
        }

        function adjustCourtsArray() {
            // コートを増やす
            while(globalData.courts.length < globalData.maxCourts) {
                globalData.courts.push({ id: globalData.courts.length + 1, p: [], updated: false });
            }
            // コートを減らす（減らされたコートの人は待機に戻る）
            while(globalData.courts.length > globalData.maxCourts) {
                let removed = globalData.courts.pop();
                removed.p.forEach(id => {
                    let p = globalData.players.find(player => player.id === id);
                    if (p) p.status = 'waiting';
                });
            }
        }

        function resetData() {
            if(confirm("名簿を含む全てのデータを削除して初期化しますか？")) {
                globalData.players = [];
                globalData.courts = [];
                globalData.nextQueue = [];
                adjustCourtsArray();
                saveAndRender();
            }
        }

        // -------------------------
        // 3. 受付・名簿ロジック
        // -------------------------
        function registerRoster() {
            const input = document.getElementById('newName');
            let name = input.value.trim();
            if (!name) return;
            if (name.length > 6) name = name.substring(0, 6);
            
            let newId = globalData.players.length > 0 ? Math.max(...globalData.players.map(p => p.id)) + 1 : 1;
            globalData.players.push({
                id: newId,
                name: name,
                playCount: 0,
                status: 'inactive',
                waitedRounds: 0,
                lastAssigned: 0
            });
            input.value = '';
            saveAndRender();
        }

        function togglePlayerStatus(id) {
            let p = globalData.players.find(p => p.id === id);
            if (!p) return;
            
            if (p.status === 'inactive') {
                // 受付（参加）
                p.status = 'waiting';
                p.lastAssigned = Date.now(); // 参加したばかりは優先度低め
                p.waitedRounds = 0;
            } else {
                // 帰宅・休憩（離脱）
                p.status = 'inactive';
                globalData.nextQueue = globalData.nextQueue.filter(qid => qid !== id);
                globalData.courts.forEach(c => {
                    c.p = c.p.filter(cid => cid !== id);
                });
            }
            fillNextQueue();
            saveAndRender();
        }

        // -------------------------
        // 4. マッチメイキング (順次モード)
        // -------------------------
        function fillNextQueue() {
            if (globalData.mode !== 'continuous') return;
            
            // 状態矛盾の解消 (inactiveやplayingの人がNEXTにいたら除外)
            globalData.nextQueue = globalData.nextQueue.filter(id => {
                let p = globalData.players.find(p => p.id === id);
                return p && p.status === 'waiting';
            });

            // NEXTに入っていない待機者を取得
            let available = globalData.players.filter(p => p.status === 'waiting' && !globalData.nextQueue.includes(p.id));
            
            // 公平性ロジック:
            // 1. プレイ回数が少ない人を優先
            // 2. 同数の場合、最後に割り当てられた時間が古い（長く休んでいる）人を優先
            available.sort((a, b) => {
                if (a.playCount !== b.playCount) return a.playCount - b.playCount;
                return a.lastAssigned - b.lastAssigned;
            });

            // NEXT枠を4人になるまで補充
            while (globalData.nextQueue.length < 4 && available.length > 0) {
                let p = available.shift();
                globalData.nextQueue.push(p.id);
            }
        }

        function handleCourtClick(courtIndex) {
            if (globalData.mode !== 'continuous') return;
            let court = globalData.courts[courtIndex];

            // 1. 現在コートにいる人を待機状態に戻す
            court.p.forEach(id => {
                let player = globalData.players.find(p => p.id === id);
                if (player) {
                    player.status = 'waiting';
                    // 終わった直後なので最新のタイムスタンプにして優先度を下げる
                    player.lastAssigned = Date.now(); 
                }
            });

            // NEXT枠の補充（クリック直前に人数が増えている場合を考慮）
            fillNextQueue();

            // 2. NEXTに4人いればコートに入れる
            if (globalData.nextQueue.length >= 4) {
                court.p = globalData.nextQueue.splice(0, 4);
                let now = Date.now();
                court.p.forEach(id => {
                    let player = globalData.players.find(p => p.id === id);
                    if (player) {
                        player.status = 'playing';
                        player.playCount++;
                        player.lastAssigned = now; // 最新の参加時間に更新
                    }
                });
                // チームをランダムシャッフル
                court.p.sort(() => Math.random() - 0.5);
                
                // 色付け更新
                globalData.courts.forEach(c => c.updated = false);
                court.updated = true;
            } else {
                court.p = []; // 4人揃わなければ空にする
                globalData.courts.forEach(c => c.updated = false);
            }

            fillNextQueue();
            saveAndRender();
        }

        // -------------------------
        // 5. マッチメイキング (一斉モード)
        // -------------------------
        function generateMatchesAll() {
            // 全員待機に戻す
            globalData.players.forEach(p => { if (p.status === 'playing') p.status = 'waiting'; });
            globalData.courts.forEach(c => { c.p = []; c.updated = false; });

            let waiting = globalData.players.filter(p => p.status === 'waiting');
            if (waiting.length < 4) {
                alert("参加人数が4名未満です。");
                return;
            }

            // 公平性ロジック (2回休み防止)
            // 1. 前回休んだ人 (waitedRounds > 0) を最優先
            // 2. プレイ回数が少ない人
            // 3. ランダム
            waiting.sort((a, b) => {
                let aPrio = a.waitedRounds > 0 ? 1 : 0;
                let bPrio = b.waitedRounds > 0 ? 1 : 0;
                if (aPrio !== bPrio) return bPrio - aPrio;
                if (a.playCount !== b.playCount) return a.playCount - b.playCount;
                return Math.random() - 0.5;
            });

            let courtsToUse = Math.min(globalData.maxCourts, Math.floor(waiting.length / 4));
            let assignedCount = 0;

            for (let i = 0; i < courtsToUse; i++) {
                let selected = waiting.slice(i * 4, i * 4 + 4);
                selected.forEach(p => {
                    p.status = 'playing';
                    p.playCount++;
                    p.waitedRounds = 0;
                    globalData.courts[i].p.push(p.id);
                });
                globalData.courts[i].p.sort(() => Math.random() - 0.5);
                assignedCount += 4;
            }

            // 選ばれなかった人の休みカウントを増やす
            for (let i = assignedCount; i < waiting.length; i++) {
                waiting[i].waitedRounds++;
            }

            saveAndRender();
        }

        // -------------------------
        // 6. 描画と保存
        // -------------------------
        function saveAndRender() {
            try { localStorage.setItem('badminPlayersV4', JSON.stringify(globalData)); } catch(e) {}
            
            document.getElementById('courtCountDisplay').innerText = globalData.maxCourts;
            
            // モードに応じたUI切り替え
            const isCont = (globalData.mode === 'continuous');
            document.getElementById('modeAllControls').style.display = isCont ? 'none' : 'flex';
            document.getElementById('nextPanel').style.display = isCont ? 'block' : 'none';

            renderLists();
            if (isCont) renderNext();
            renderCourts();
        }

        function renderLists() {
            const inactiveArea = document.getElementById('inactiveList');
            const activeArea = document.getElementById('activeList');
            inactiveArea.innerHTML = "";
            activeArea.innerHTML = "";
            
            let activeCount = 0;

            // 名簿順に表示するためIDでソート
            let sortedPlayers = [...globalData.players].sort((a, b) => a.id - b.id);

            sortedPlayers.forEach(p => {
                let isNext = globalData.nextQueue.includes(p.id);
                let statusClass = p.status;
                if (isNext) statusClass = 'next';

                let html = `
                    <div class="player-chip ${statusClass}" onclick="togglePlayerStatus(${p.id})">
                        <div class="chip-name">${p.name}</div>
                        <div class="chip-stats">${p.playCount}回</div>
                    </div>
                `;
                
                if (p.status === 'inactive') {
                    inactiveArea.innerHTML += html;
                } else {
                    activeArea.innerHTML += html;
                    activeCount++;
                }
            });
            document.getElementById('activeCount').innerText = activeCount;
        }

        function renderNext() {
            const nextArea = document.getElementById('nextSlots');
            nextArea.innerHTML = "";
            for (let i = 0; i < 4; i++) {
                if (i < globalData.nextQueue.length) {
                    let p = globalData.players.find(player => player.id === globalData.nextQueue[i]);
                    nextArea.innerHTML += `<div class="next-slot" style="background:var(--accent); border-color:#F59E0B;">${p ? p.name : ''}</div>`;
                } else {
                    nextArea.innerHTML += `<div class="next-slot">不足</div>`;
                }
            }
        }

        function renderCourts() {
            const area = document.getElementById('courtsArea');
            area.innerHTML = "";
            const isCont = (globalData.mode === 'continuous');

            globalData.courts.forEach((c, index) => {
                let courtClass = "court";
                if (isCont) courtClass += " clickable";
                if (c.updated) courtClass += " updated";
                
                let clickAction = isCont ? `onclick="handleCourtClick(${index})"` : "";
                
                let innerHtml = `<div class="court-header">コート ${c.id}</div>`;

                if (c.p.length === 4) {
                    let p1 = globalData.players.find(p => p.id === c.p[0])?.name || "";
                    let p2 = globalData.players.find(p => p.id === c.p[1])?.name || "";
                    let p3 = globalData.players.find(p => p.id === c.p[2])?.name || "";
                    let p4 = globalData.players.find(p => p.id === c.p[3])?.name || "";
                    
                    innerHtml += `
                        <div class="match-row">
                            <div class="team">${p1}<br>${p2}</div>
                            <div class="vs">VS</div>
                            <div class="team team-b">${p3}<br>${p4}</div>
                        </div>
                    `;
                    if (isCont) innerHtml += `<div class="court-action-text">タップして試合終了 ➔ 次を入れる</div>`;
                } else {
                    innerHtml += `<div class="empty-text">待機中</div>`;
                    if (isCont) innerHtml += `<div class="court-action-text">タップしてNEXTから補充</div>`;
                }

                area.innerHTML += `<div class="${courtClass}" ${clickAction}>${innerHtml}</div>`;
            });
        }
    </script>
</body>
</html>
