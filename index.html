<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>バドミントン組み合わせボード V5</title>
    <style>
        :root {
            --primary: #4F46E5;
            --bg: #111827;
            --surface: #1F2937;
            --surface-light: #374151;
            --text: #F9FAFB;
            --accent: #FBBF24; /* 待機(黄) */
            --next: #A855F7;   /* NEXT(紫) */
            --success: #10B981;/* 試合中(緑) */
            --team-a: #10B981;
            --team-b: #3B82F6;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 10px;
        }
        h1, h2, h3 { margin: 0 0 10px 0; text-align: center; }
        h1 { font-size: 1.8rem; color: #F59E0B; margin-bottom: 20px;}
        
        .app-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        @media (min-width: 1024px) {
            .app-container { flex-direction: row; align-items: flex-start; }
            .sidebar { width: 320px; flex-shrink: 0; position: sticky; top: 10px; }
            .main-board { flex-grow: 1; }
        }

        /* サイドバー (設定・受付) */
        .sidebar {
            background: var(--surface);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .settings-group {
            background: var(--surface-light);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .settings-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1rem;
        }
        select, input[type="text"] {
            background: var(--bg);
            color: white;
            border: 1px solid #4B5563;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 1rem;
            width: 100%;
            box-sizing: border-box;
        }
        .btn-small { background: var(--primary); color: white; border: none; padding: 5px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1.2rem;}
        .btn-small:active { transform: scale(0.95); }

        .btn-reception {
            background: #F59E0B;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .btn-reception:active { transform: scale(0.98); }

        .active-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 8px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 5px;
        }
        .player-chip {
            background: var(--surface-light);
            border: 2px solid transparent;
            border-radius: 6px;
            padding: 8px 4px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .player-chip:active { transform: scale(0.95); }
        .chip-name { font-size: 1rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chip-stats { font-size: 0.75rem; color: #9CA3AF; }
        
        /* 状態によるチップの色分け */
        .player-chip.waiting { border-color: var(--accent); background: rgba(251, 191, 36, 0.1); }
        .player-chip.playing { border-color: var(--success); background: rgba(16, 185, 129, 0.1); }
        .player-chip.next { border-color: var(--next); background: rgba(168, 85, 247, 0.1); }

        /* メインボード */
        .main-board {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .action-bar {
            display: flex;
            justify-content: center;
            background: var(--surface);
            padding: 15px;
            border-radius: 12px;
        }
        .action-btn { background: #F59E0B; color: white; border: none; padding: 15px 30px; border-radius: 8px; font-size: 1.3rem; font-weight: bold; cursor: pointer; width: 100%; max-width: 400px;}
        .action-btn:active { transform: scale(0.98); }

        /* NEXTパネル */
        .next-panel {
            background: #2E1065;
            border: 2px solid var(--next);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
        }
        .next-panel h3 { color: #DDD6FE; font-size: 1.2rem; margin-bottom: 15px;}
        .next-slots {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .next-slot {
            background: rgba(139, 92, 246, 0.3);
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px dashed var(--next);
            min-width: 80px;
        }

        /* コート表示 */
        .courts-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
        }
        .court {
            background: var(--surface);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            border: 2px solid var(--surface-light);
            position: relative;
        }
        .court.clickable { cursor: pointer; transition: transform 0.1s, box-shadow 0.2s; }
        .court.clickable:active { transform: scale(0.98); }
        .court.clickable:hover { border-color: #6B7280; }
        
        /* 更新されたコートの強調 */
        .court.updated {
            border-color: #F59E0B;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.4);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 15px rgba(245, 158, 11, 0.4); }
            50% { box-shadow: 0 0 25px rgba(245, 158, 11, 0.8); }
            100% { box-shadow: 0 0 15px rgba(245, 158, 11, 0.4); }
        }

        .court-header { 
            background: var(--surface-light); 
            color: #D1D5DB; 
            font-size: 1.2rem; 
            font-weight: bold; 
            padding: 6px; 
            border-radius: 6px;
            margin-bottom: 10px;
        }
        .match-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 10px; }
        .team { 
            font-size: 1.2rem; 
            font-weight: bold; 
            background: var(--team-a); 
            color: white;
            padding: 10px;
            border-radius: 8px;
            flex-grow: 1;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }
        .team.team-b { background: var(--team-b); }
        .vs { color: #9CA3AF; font-size: 1rem; font-weight: bold; }
        
        .court-action-text {
            color: #9CA3AF;
            font-size: 0.9rem;
            margin-top: 10px;
        }
        .empty-text { padding: 30px 0; color: #6B7280; font-size: 1.1rem; }
    </style>
</head>
<body>

    <h1>🏸 組み合わせボード V5</h1>
    
    <div class="app-container">
        
        <!-- 左側：設定・受付パネル -->
        <aside class="sidebar">
            <div class="settings-group">
                <h3>💰 受付（参加登録）</h3>
                <p style="font-size:0.8rem; color:#9CA3AF; margin:0 0 10px 0;">既存メンバーを選択、または新規入力</p>
                
                <select id="rosterSelect" style="margin-bottom:10px;">
                    <option value="">-- 登録済みから選択 --</option>
                </select>
                
                <div style="text-align:center; color:#9CA3AF; font-size:0.9rem; margin-bottom:10px;">または</div>
                
                <input type="text" id="newName" maxlength="6" placeholder="新規ニックネーム(6文字内)">
                
                <button onclick="handleReception()" class="btn-reception">受付する（参加中へ）</button>
            </div>

            <div class="settings-group">
                <h3>⚙️ 設定</h3>
                <div class="settings-row">
                    <span>進行モード</span>
                    <select id="modeSelect" onchange="changeMode()" style="width:auto;">
                        <option value="continuous">順次入替 (NEXT連動)</option>
                        <option value="all">一斉入替 (従来型)</option>
                    </select>
                </div>
                <div class="settings-row">
                    <span>使用コート上限</span>
                    <div>
                        <button class="btn-small" onclick="changeMaxCourts(-1)">-</button>
                        <span id="courtCountDisplay" style="margin: 0 10px; font-size: 1.2rem; font-weight: bold;">6</span>
                        <button class="btn-small" onclick="changeMaxCourts(1)">+</button>
                    </div>
                </div>
                <button onclick="resetData()" style="background:#EF4444; color:white; border:none; padding:8px; border-radius:6px; margin-top:10px; cursor:pointer;">⚠️ 全データリセット</button>
            </div>
        </aside>

        <!-- 右側：メインボード -->
        <main class="main-board">
            
            <div style="background:var(--surface); padding:15px; border-radius:12px;">
                <h3>👥 本日の参加者 (<span id="activeCount" style="color:#F59E0B;">0</span>名)</h3>
                <p style="font-size:0.85rem; color:#9CA3AF; margin:0 0 10px 0;">
                    枠色：<span style="color:var(--accent); font-weight:bold;">黄=待機</span>, 
                    <span style="color:#A855F7; font-weight:bold;">紫=NEXT</span>, 
                    <span style="color:var(--success); font-weight:bold;">緑=試合中</span> 
                    （※タップで帰宅・名簿戻し）
                </p>
                <div class="active-grid" id="activeList">
                    <!-- 参加中データ -->
                </div>
            </div>

            <!-- 一斉入れ替えモード用ボタン -->
            <div class="action-bar" id="modeAllControls" style="display: none;">
                <button onclick="generateMatchesAll()" class="action-btn">⚡ 組み合わせを作成 (一斉)</button>
            </div>

            <!-- 順次入れ替えモード用NEXTパネル -->
            <div class="next-panel" id="nextPanel">
                <h3>⏩ NEXT 待機枠 (次の空きコートに入ります)</h3>
                <div class="next-slots" id="nextSlots">
                    <div class="next-slot">不足</div>
                    <div class="next-slot">不足</div>
                    <div class="next-slot">不足</div>
                    <div class="next-slot">不足</div>
                </div>
            </div>

            <div class="courts-container" id="courtsArea">
                <!-- コートデータ -->
            </div>

        </main>
    </div>

    <script>
        // -------------------------
        // 1. データ構造と初期化
        // -------------------------
        const MAX_POSSIBLE_COURTS = 12;
        let globalData = {
            mode: 'continuous',
            maxCourts: 6,
            players: [], // master DB. { id, name, playCount, status: 'inactive'|'waiting'|'playing', lastAssigned, waitedRounds }
            courts: [], 
            nextQueue: [] 
        };

        window.onload = function() {
            try {
                let saved = localStorage.getItem('badminPlayersV5');
                if (saved) {
                    let parsed = JSON.parse(saved);
                    globalData.mode = parsed.mode || 'continuous';
                    globalData.maxCourts = parsed.maxCourts || 6;
                    globalData.players = parsed.players || [];
                    globalData.courts = parsed.courts || [];
                    globalData.nextQueue = parsed.nextQueue || [];
                }
            } catch(e) { console.log("初期ロードスキップ"); }
            
            document.getElementById('modeSelect').value = globalData.mode;
            adjustCourtsArray();
            saveAndRender();
        };

        // -------------------------
        // 2. 設定関連ロジック
        // -------------------------
        function changeMode() {
            globalData.mode = document.getElementById('modeSelect').value;
            globalData.players.forEach(p => { if (p.status !== 'inactive') p.status = 'waiting'; });
            globalData.courts.forEach(c => { c.p = []; c.updated = false; });
            globalData.nextQueue = [];
            fillNextQueue();
            saveAndRender();
        }

        function changeMaxCourts(delta) {
            let newMax = globalData.maxCourts + delta;
            if (newMax >= 1 && newMax <= MAX_POSSIBLE_COURTS) {
                globalData.maxCourts = newMax;
                adjustCourtsArray();
                fillNextQueue();
                saveAndRender();
            }
        }

        function adjustCourtsArray() {
            while(globalData.courts.length < globalData.maxCourts) {
                globalData.courts.push({ id: globalData.courts.length + 1, p: [], updated: false });
            }
            while(globalData.courts.length > globalData.maxCourts) {
                let removed = globalData.courts.pop();
                removed.p.forEach(id => {
                    let p = globalData.players.find(player => player.id === id);
                    if (p) p.status = 'waiting';
                });
            }
        }

        function resetData() {
            if(confirm("名簿を含む全てのデータを削除して初期化しますか？")) {
                globalData.players = [];
                globalData.courts = [];
                globalData.nextQueue = [];
                adjustCourtsArray();
                saveAndRender();
            }
        }

        // -------------------------
        // 3. 受付・名簿ロジック
        // -------------------------
        function handleReception() {
            const select = document.getElementById('rosterSelect');
            const input = document.getElementById('newName');
            const selectVal = select.value;
            let newNameVal = input.value.trim();

            let targetName = newNameVal || selectVal;
            if (!targetName) {
                alert("登録済みリストから選択するか、新規ニックネームを入力してください。");
                return;
            }

            if (newNameVal.length > 6) newNameVal = newNameVal.substring(0, 6);

            // 新規入力の場合、重複チェック
            if (newNameVal) {
                let exists = globalData.players.some(p => p.name === newNameVal);
                if (exists) {
                    alert("「" + newNameVal + "」は既に登録されています。別の名前を指定するか、リストから選択してください。");
                    return;
                }
            }

            let player = globalData.players.find(p => p.name === targetName);
            
            // 後から参加した人の参加回数を現在の最大回数に合わせる（追いつき優先を防ぐ）
            let activePlayers = globalData.players.filter(p => p.status !== 'inactive');
            let baselinePlayCount = activePlayers.length > 0 ? Math.max(...activePlayers.map(p => p.playCount)) : 0;

            if (!player) {
                // 新規登録＆受付
                player = {
                    id: Date.now(),
                    name: targetName,
                    playCount: baselinePlayCount,
                    status: 'waiting',
                    waitedRounds: 0,
                    lastAssigned: Date.now()
                };
                globalData.players.push(player);
            } else {
                // 既存メンバーの受付
                player.status = 'waiting';
                player.playCount = baselinePlayCount; // 長期離脱からの復帰時も優先されないようにリセット
                player.lastAssigned = Date.now();
            }

            input.value = "";
            select.value = "";
            
            fillNextQueue();
            saveAndRender();
        }

        function handlePlayerClick(id) {
            let p = globalData.players.find(p => p.id === id);
            if (!p) return;
            
            if (p.status !== 'inactive') {
                if (confirm(p.name + " さんを帰宅（休憩）状態にして名簿に戻しますか？")) {
                    p.status = 'inactive';
                    globalData.nextQueue = globalData.nextQueue.filter(qid => qid !== id);
                    globalData.courts.forEach(c => {
                        c.p = c.p.filter(cid => cid !== id);
                    });
                    fillNextQueue();
                    saveAndRender();
                }
            }
        }

        // -------------------------
        // 4. マッチメイキング (順次モード)
        // -------------------------
        function fillNextQueue() {
            if (globalData.mode !== 'continuous') return;
            
            // 状態矛盾の解消 (NEXTに4人を超えないように厳密化)
            globalData.nextQueue = globalData.nextQueue.filter(id => {
                let p = globalData.players.find(p => p.id === id);
                return p && p.status === 'waiting';
            }).slice(0, 4);

            let available = globalData.players.filter(p => p.status === 'waiting' && !globalData.nextQueue.includes(p.id));
            
            available.sort((a, b) => {
                if (a.playCount !== b.playCount) return a.playCount - b.playCount;
                return a.lastAssigned - b.lastAssigned;
            });

            while (globalData.nextQueue.length < 4 && available.length > 0) {
                let p = available.shift();
                globalData.nextQueue.push(p.id);
            }
        }

        function handleCourtClick(courtIndex) {
            if (globalData.mode !== 'continuous') return;
            let court = globalData.courts[courtIndex];

            court.p.forEach(id => {
                let player = globalData.players.find(p => p.id === id);
                if (player) {
                    player.status = 'waiting';
                    player.lastAssigned = Date.now(); 
                }
            });

            fillNextQueue();

            if (globalData.nextQueue.length >= 4) {
                court.p = globalData.nextQueue.splice(0, 4);
                let now = Date.now();
                court.p.forEach(id => {
                    let player = globalData.players.find(p => p.id === id);
                    if (player) {
                        player.status = 'playing';
                        player.playCount++;
                        player.lastAssigned = now;
                    }
                });
                court.p.sort(() => Math.random() - 0.5);
                
                globalData.courts.forEach(c => c.updated = false);
                court.updated = true;
            } else {
                court.p = []; 
                globalData.courts.forEach(c => c.updated = false);
            }

            fillNextQueue();
            saveAndRender();
        }

        // -------------------------
        // 5. マッチメイキング (一斉モード)
        // -------------------------
        function generateMatchesAll() {
            globalData.players.forEach(p => { if (p.status === 'playing') p.status = 'waiting'; });
            globalData.courts.forEach(c => { c.p = []; c.updated = false; });

            let waiting = globalData.players.filter(p => p.status === 'waiting');
            if (waiting.length < 4) {
                alert("参加人数が4名未満です。");
                return;
            }

            waiting.sort((a, b) => {
                let aPrio = a.waitedRounds > 0 ? 1 : 0;
                let bPrio = b.waitedRounds > 0 ? 1 : 0;
                if (aPrio !== bPrio) return bPrio - aPrio;
                if (a.playCount !== b.playCount) return a.playCount - b.playCount;
                return Math.random() - 0.5;
            });

            let courtsToUse = Math.min(globalData.maxCourts, Math.floor(waiting.length / 4));
            let assignedCount = 0;

            for (let i = 0; i < courtsToUse; i++) {
                let selected = waiting.slice(i * 4, i * 4 + 4);
                selected.forEach(p => {
                    p.status = 'playing';
                    p.playCount++;
                    p.waitedRounds = 0;
                    globalData.courts[i].p.push(p.id);
                });
                globalData.courts[i].p.sort(() => Math.random() - 0.5);
                assignedCount += 4;
            }

            for (let i = assignedCount; i < waiting.length; i++) {
                waiting[i].waitedRounds++;
            }

            saveAndRender();
        }

        // -------------------------
        // 6. 描画と保存
        // -------------------------
        function saveAndRender() {
            try { localStorage.setItem('badminPlayersV5', JSON.stringify(globalData)); } catch(e) {}
            
            document.getElementById('courtCountDisplay').innerText = globalData.maxCourts;
            
            const isCont = (globalData.mode === 'continuous');
            document.getElementById('modeAllControls').style.display = isCont ? 'none' : 'flex';
            document.getElementById('nextPanel').style.display = isCont ? 'block' : 'none';

            renderRosterSelect();
            renderActiveList();
            if (isCont) renderNext();
            renderCourts();
        }

        function renderRosterSelect() {
            const select = document.getElementById('rosterSelect');
            let currentVal = select.value;
            select.innerHTML = '<option value="">-- 登録済みから選択 --</option>';
            
            let inactivePlayers = globalData.players.filter(p => p.status === 'inactive');
            // 名前順などでソート可能だが、ここでは登録順(ID順)とする
            inactivePlayers.sort((a, b) => a.id - b.id).forEach(p => {
                select.innerHTML += `<option value="${p.name}">${p.name}</option>`;
            });
            select.value = currentVal;
        }

        function renderActiveList() {
            const activeArea = document.getElementById('activeList');
            activeArea.innerHTML = "";
            let activeCount = 0;

            let sortedPlayers = [...globalData.players]
                .filter(p => p.status !== 'inactive')
                .sort((a, b) => a.id - b.id);

            sortedPlayers.forEach(p => {
                let isNext = globalData.nextQueue.includes(p.id);
                let statusClass = p.status;
                if (isNext) statusClass = 'next';

                activeArea.innerHTML += `
                    <div class="player-chip ${statusClass}" onclick="handlePlayerClick(${p.id})">
                        <div class="chip-name">${p.name}</div>
                        <div class="chip-stats">${p.playCount}回</div>
                    </div>
                `;
                activeCount++;
            });
            document.getElementById('activeCount').innerText = activeCount;
        }

        function renderNext() {
            const nextArea = document.getElementById('nextSlots');
            nextArea.innerHTML = "";
            for (let i = 0; i < 4; i++) {
                if (i < globalData.nextQueue.length) {
                    let p = globalData.players.find(player => player.id === globalData.nextQueue[i]);
                    nextArea.innerHTML += `<div class="next-slot" style="background:var(--next); border-color:#8B5CF6;">${p ? p.name : ''}</div>`;
                } else {
                    nextArea.innerHTML += `<div class="next-slot">不足</div>`;
                }
            }
        }

        function renderCourts() {
            const area = document.getElementById('courtsArea');
            area.innerHTML = "";
            const isCont = (globalData.mode === 'continuous');

            globalData.courts.forEach((c, index) => {
                let courtClass = "court";
                if (isCont) courtClass += " clickable";
                if (c.updated) courtClass += " updated";
                
                let clickAction = isCont ? `onclick="handleCourtClick(${index})"` : "";
                
                let innerHtml = `<div class="court-header">コート ${c.id}</div>`;

                if (c.p.length === 4) {
                    let p1 = globalData.players.find(p => p.id === c.p[0])?.name || "";
                    let p2 = globalData.players.find(p => p.id === c.p[1])?.name || "";
                    let p3 = globalData.players.find(p => p.id === c.p[2])?.name || "";
                    let p4 = globalData.players.find(p => p.id === c.p[3])?.name || "";
                    
                    innerHtml += `
                        <div class="match-row">
                            <div class="team">${p1}<br>${p2}</div>
                            <div class="vs">VS</div>
                            <div class="team team-b">${p3}<br>${p4}</div>
                        </div>
                    `;
                    if (isCont) innerHtml += `<div class="court-action-text">タップして試合終了 ➔ 次を入れる</div>`;
                } else {
                    innerHtml += `<div class="empty-text">待機中</div>`;
                    if (isCont) innerHtml += `<div class="court-action-text">タップしてNEXTから補充</div>`;
                }

                area.innerHTML += `<div class="${courtClass}" ${clickAction}>${innerHtml}</div>`;
            });
        }
    </script>
</body>
</html>
